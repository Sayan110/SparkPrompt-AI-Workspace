# SparkPrompt shared routing (Phase 4D, Step 13) — included by every server
# block (active HTTP config and the TLS template), so both listeners behave
# identically:
#
#   /api/*  -> FastAPI        (upstream sparkprompt_api, :8000)
#   /*      -> Next.js        (upstream sparkprompt_web, :3000)
#
# $scheme comes from the including server block: "http" locally, "https" in
# the TLS deployment — so X-Forwarded-Proto always carries the browser-facing
# protocol (Step 16).

# FastAPI — cookies and Origin pass through untouched; the API emits its own
# security headers (Phase 4A) and they are forwarded as-is.
location /api/ {
    proxy_pass http://sparkprompt_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite — never append — client-supplied forwarding headers: this
    # proxy is the single trusted source (Step 16). uvicorn only honors these
    # when the peer (this proxy) is in --forwarded-allow-ips; a public client
    # cannot mint X-Forwarded-* values that reach the API.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Phase 4E: correlation id — generated by nginx ($request_id, 32 hex,
    # always matches the API's inbound-id rule) and trusted only from this
    # single proxy hop; the API echoes it on the response and stamps it on
    # every application log record.
    proxy_set_header X-Request-ID $request_id;
    # Longest legitimate wait: AI generation runs up to AI_TIMEOUT_SECONDS.
    proxy_read_timeout 120s;
    proxy_redirect off;
}

# Next.js — app routes and static assets.
location / {
    proxy_pass http://sparkprompt_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Phase 4E: same correlation id on the web upstream (full-stack traces).
    proxy_set_header X-Request-ID $request_id;
    proxy_redirect off;

    # Deterministic security headers for HTML: hide whatever the upstream sent
    # so exactly one copy of each header reaches the browser (Phase 4A header
    # set preserved, Step 15).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # HSTS via variable: empty in the plain-HTTP config (header omitted), set
    # by the TLS template. Only sent when HTTPS is actually guaranteed.
    add_header Strict-Transport-Security $sparkprompt_hsts always;
}

# Proxy liveness, independent of any upstream (health checks).
location = /proxy-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
