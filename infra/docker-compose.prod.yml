# SparkPrompt PRODUCTION deployment (Phase 4D, Steps 21-23).
#
# Separate from the development stack (infra/docker-compose.yml) — that file
# is untouched and keeps publishing 5432 for local work. This file:
#   - never publishes PostgreSQL (or :8000/:3000); only the proxy listens,
#     on loopback in local validation (real deployment: 80/443 + TLS),
#   - injects ALL secrets from the environment / secret infrastructure via
#     ${VAR:?...} required expansion — startup FAILS without them; there are
#     no default credentials anywhere in this file,
#   - uses restart policies as the process supervisor (Step 11) and image
#     healthchecks for liveness,
#   - has no bind mounts / source hot-reload / `next dev`.
#
# Migration-before-application is guaranteed by the api entrypoint:
# config check -> alembic upgrade head -> uvicorn, in ONE container instance
# (workers=1 default), so migrations can never race (Step 12).
#
# Required environment (see .env.production.example):
#   SESSION_SECRET  DATABASE_URL  CORS_ORIGINS  NEXT_PUBLIC_API_URL
# Optional: GEMINI_API_KEY  NVIDIA_API_KEY  AI_DEFAULT_PROVIDER  WEB_CONCURRENCY
# POSTGRES_USER/PASSWORD/DB are required for ANY compose command on this file —
# interpolation is file-wide, so with the `with-db` profile off you must still
# export placeholder values (unused; verified behavior, not an assumption).
#
# Local smoke note: profiles mean the bundled postgres does NOT start unless
# requested; local validation points DATABASE_URL at a disposable database on
# the existing development instance instead (documented in DEPLOYMENT.md §11).

name: sparkprompt-prod

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["with-db"]
    restart: unless-stopped
    # Phase 4E (P6): bounded container logs (rotation; nothing else changes).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (real value with --profile with-db; a placeholder suffices when the profile stays off — compose interpolates the whole file)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (real value with --profile with-db; a placeholder suffices when the profile stays off — compose interpolates the whole file)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required (real value with --profile with-db; a placeholder suffices when the profile stays off — compose interpolates the whole file)}
    volumes:
      - sparkprompt_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Phase 4E (P6): bounded container logs (rotation; nothing else changes).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Linux engines have no Docker Desktop magic name: map the special value
    # so `host.docker.internal` (used only by the local smoke's DATABASE_URL)
    # resolves to the host gateway on any Docker flavour.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENVIRONMENT: production
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      # Production cookie policy — fixed here, not overridable by accident.
      SESSION_COOKIE_SECURE: "true"
      # Phase 4A rate-limit + revocation state is process-local: 1 worker is
      # the safe default; raising this needs a documented justification.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      # Server-side AI provider keys pass through only when provided.
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    networks:
      - edge
      - backend
    # No ports: FastAPI is reachable only through the proxy.

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    # Phase 4E (P6): bounded container logs (rotation; nothing else changes).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    networks:
      - edge
    # No ports: Next.js is reachable only through the proxy.

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    # Phase 4E (P6): bounded container logs — nginx access/error lines live in
    # this stream (see §14: stdout/stderr redirect is applied ONLY if the
    # image does not already pipe them, verified empirically, not assumed).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Loopback-only for local validation. Real deployment: "80:80" +
      # "443:443" together with nginx-tls.conf.example (Step 14/23).
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/locations.conf:/etc/nginx/locations.conf:ro
    depends_on:
      - api
      - web
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/proxy-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sparkprompt_pgdata_prod:

networks:
  edge:
  backend:
