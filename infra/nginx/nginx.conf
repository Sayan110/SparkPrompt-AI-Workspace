# SparkPrompt reverse proxy — active local-validation configuration (4D §15/16).
#
# Listens on 8080 over plain HTTP inside the container; compose publishes it
# on loopback only (127.0.0.1:8080). TLS is NOT deployed in this environment —
# no certificates exist here and generating fake ones is out of scope. The
# production TLS structure lives in nginx-tls.conf.example + DEPLOYMENT.md.
#
# Routing (Step 13):  HTTPS/:443 (prod)  ->  /api/* FastAPI   /* Next.js
# PostgreSQL and the app ports are never exposed by this proxy.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Phase 4E: rid (per-request correlation id, same value as the API's
    # X-Request-ID), rt (total request time), urt (upstream time), us
    # (upstream status). Labeled fields stay greppable; both `main` formats
    # in this repo are kept byte-identical.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rid=$request_id rt=$request_time urt=$upstream_response_time us=$upstream_status';
    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    keepalive_timeout   65;
    server_tokens       off;   # do not advertise the nginx version

    upstream sparkprompt_api {
        server api:8000;
    }
    upstream sparkprompt_web {
        server web:3000;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 4m;

        # Empty => Strict-Transport-Security is never emitted on this HTTP
        # listener (the TLS template overrides the variable). `set` belongs
        # in server/location context, never http.
        set $sparkprompt_hsts "";

        include /etc/nginx/locations.conf;
    }
}
