# Alembic configuration -- SparkPrompt (Phase 4B).
#
# Migrations are the schema source of truth. This file intentionally contains
# NO database URL and NO credentials: migrations/env.py reads the URL from the
# application settings (environment / .env) at run time.
[alembic]
script_location = %(here)s/migrations
path_separator = os
prepend_sys_path = .
# New revisions are named "<revision>_<slug>" (e.g. 0001_baseline_sparkprompt_schema).
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
